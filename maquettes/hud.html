<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruche HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#13100c; --surface:#1c1711; --surface2:#241e17; --line:#3a3025; --line2:#4a3d2e;
  --glass:rgba(24,19,14,.78);
  --ink:#f3eada; --ink2:#a3927a; --ink3:#72634f;
  --accent:#e8a33c; --accent-hi:#ffd37a; --bad:#d9503f; --alert:#48d6e0; --done:#86b36a; --wait:#7d8e9b; --tool:#f0e0c4;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.game{display:grid;grid-template-rows:auto 1fr auto;height:100%;min-height:600px}

/* ── barre du haut : ressources façon jeu de stratégie ── */
.top{display:flex;align-items:center;gap:18px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:1px 5px}
.task{flex:1 1 220px;min-width:0;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task i{font-style:normal;font-family:var(--mono);color:var(--accent);margin-right:6px}
.res{display:flex;gap:14px;flex-wrap:wrap}
.r{display:grid;grid-template-columns:auto auto;gap:1px 8px;align-items:baseline;min-width:92px}
.r .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.r .v{font-family:var(--mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.r .g{grid-column:1/-1;height:4px;background:var(--line);border-radius:1px;overflow:hidden}
.r .g i{display:block;height:100%;background:var(--accent);transition:width .2s}
.r.hot .g i{background:var(--bad)}
.pill{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:3px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.ok{color:var(--done);border-color:color-mix(in srgb,var(--done) 55%,transparent);background:color-mix(in srgb,var(--done) 10%,transparent)}
.pill.run{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}

/* ── la scène et ses calques ── */
.main{position:relative;min-height:0;overflow:hidden}
.stage{position:absolute;inset:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;z-index:0}
.hud{position:absolute;pointer-events:auto;z-index:2}

.plate{pointer-events:none;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;min-width:118px;
  padding:5px 7px 6px;background:rgba(19,16,12,.72);border:1px solid rgba(74,61,46,.9);border-radius:3px}
.plate.sel{border-color:var(--accent-hi)}
.plate.off{opacity:.45}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl-top b{font-weight:700;font-size:12px;font-stretch:112%;letter-spacing:.01em}
.pl-st{font-family:var(--mono);font-size:9.5px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.pl-st i{width:6px;height:6px;border-radius:1px;display:inline-block}
.pl-g{height:4px;background:#3a3025;border-radius:1px;overflow:hidden;display:flex}
.pl-g i{display:block;height:100%}
.pl-num{font-family:var(--mono);font-size:9.5px;color:var(--ink2);white-space:nowrap}
.pl-hand{font-family:var(--mono);font-size:9.5px;color:var(--alert);font-weight:600;letter-spacing:.08em}
.pl-hand:empty{display:none}

/* barre de compétences : un emplacement par outil, l'identité portée par le glyphe */
.skills{display:flex;gap:3px;margin-top:1px}
.slot{position:relative;width:24px;height:24px;border:1px solid #4a3d2e;border-radius:2px;background:#15110d;display:grid;place-items:center;color:#8d7c64}
.slot svg{width:14px;height:14px}
.slot .n{position:absolute;right:1px;bottom:0;font-family:var(--mono);font-size:8.5px;line-height:1;color:var(--ink);text-shadow:0 0 3px #000}
.slot .x{position:absolute;left:1px;top:0;font-family:var(--mono);font-size:8.5px;line-height:1;color:#ff7a66;font-weight:600}
.slot.used{color:var(--tool);border-color:#6d5c45}
.slot.denied{border-color:color-mix(in srgb,var(--bad) 70%,transparent)}
.slot.denied::after{content:"";position:absolute;inset:3px;background:linear-gradient(135deg,transparent 46%,rgba(217,80,63,.85) 47%,rgba(217,80,63,.85) 53%,transparent 54%)}
.slot.off{opacity:.3}
.slot.active{border-color:var(--accent-hi);box-shadow:0 0 0 1px var(--accent-hi),0 0 10px rgba(255,211,122,.55);color:var(--accent-hi)}
.slot.cast{animation:cast 1.2s ease-out}
.slot.castbad{animation:castbad 1.2s ease-out}
@keyframes cast{0%{background:#ffd37a;color:#1b1305;box-shadow:0 0 16px #ffd37a}100%{background:#15110d}}
@keyframes castbad{0%{background:#d9503f;color:#fff;box-shadow:0 0 16px #d9503f}100%{background:#15110d}}

/* étiquette d'autel */
.altar{pointer-events:none;transform:translateY(-50%);display:grid;grid-template-columns:auto 1fr auto;gap:2px 7px;align-items:center;min-width:128px;max-width:180px;
  padding:5px 8px;background:rgba(19,16,12,.8);border:1px solid #4a3d2e;border-radius:3px}
.altar svg{width:16px;height:16px;color:var(--tool)}
.altar b{font-stretch:118%;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.altar .c{font-family:var(--mono);font-size:11px;color:var(--accent-hi);text-align:right}
.altar .c em{font-style:normal;color:#ff7a66;margin-left:5px}
.altar .l{grid-column:1/-1;font-family:var(--mono);font-size:9.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.altar.hit{border-color:var(--accent-hi)}
.altar.hitbad{border-color:var(--bad)}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tl{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border:1px solid var(--line);border-radius:3px;background:rgba(0,0,0,.2)}
.tl svg{width:18px;height:18px;color:var(--tool)}
.tl b{font-size:11px;font-weight:600}
.tl span{font-family:var(--mono);font-size:10px;color:var(--ink2)}
.tl span em{font-style:normal;color:#ff7a66}
.tl.zero{opacity:.35}

.bubble{pointer-events:none;max-width:210px;padding:6px 9px;border-radius:10px 10px 10px 2px;font-size:11.5px;line-height:1.35;
  background:rgba(243,234,218,.94);color:#1b1305;transform:translate(20%,-100%);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.bubble.tool{background:rgba(28,23,17,.94);color:var(--tool);font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:3px}
.bubble.tool::before{content:"$ ";color:var(--accent)}

.float{pointer-events:none;font-family:var(--mono);font-weight:600;font-size:12px;white-space:nowrap;
  text-shadow:0 1px 0 #000,0 0 10px rgba(0,0,0,.8);will-change:transform,opacity}
.f-tok{color:var(--accent-hi)} .f-ok{color:var(--tool)} .f-bad{color:#ff7a66;font-size:13px}
.f-good{color:#a8d88a} .f-alert{color:var(--alert);font-size:13px;letter-spacing:.08em} .f-human{color:var(--accent-hi);font-size:13px}

/* mini-carte */
.minimap{top:12px;left:12px;width:156px;background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:6px;backdrop-filter:blur(6px)}
.minimap canvas{display:block;width:144px;height:144px}
.hudlabel{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 5px}

/* caméra */
.cam{top:12px;left:180px;display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.cam button{padding:6px 11px;font-size:11px;background:var(--surface);color:var(--ink2)}
.cam button[aria-pressed="true"]{background:var(--accent);color:#1b1305;font-weight:600}
.cam button:hover{color:var(--ink)}

/* bannière main levée */
.alert{top:56px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 420px));min-width:280px;display:flex;gap:12px;align-items:center;
  padding:10px 12px;border:1px solid color-mix(in srgb,var(--alert) 60%,transparent);border-radius:4px;
  background:color-mix(in srgb,var(--alert) 12%,rgba(19,16,12,.9));backdrop-filter:blur(6px)}
.alert b{display:block;font-stretch:120%;font-weight:800;font-size:11px;letter-spacing:.16em;color:var(--alert)}
.alert p{margin:2px 0 0;font-size:12px}
.alert button{margin-left:auto;flex:none;border:1px solid var(--alert);color:var(--alert);border-radius:3px;padding:5px 10px;font-size:11px}
.alert button:hover{background:color-mix(in srgb,var(--alert) 18%,transparent)}

/* fil d'événements */
.feed{left:12px;bottom:12px;width:330px;display:flex;flex-direction:column;gap:2px}
.fe{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:4px 8px;background:var(--glass);border-radius:3px;font-size:11.5px;
  animation:fe-in .25s ease-out}
.fe:nth-child(n+4){opacity:.72} .fe:nth-child(n+6){opacity:.45}
.fe .t{font-family:var(--mono);font-size:10px;color:var(--ink3);padding-top:1px}
.fe .x{min-width:0;overflow-wrap:anywhere}
.fe .x b{font-weight:600} .fe .x em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.fe.bad .x b:last-of-type,.fe.bad .v{color:#ff7a66} .fe.alert .v{color:var(--alert)} .fe.human .v{color:var(--accent-hi)} .fe.good .v{color:var(--done)}
.fe .v{font-weight:600}
@keyframes fe-in{from{transform:translateX(-8px);opacity:0}}

/* ── fiche d'unité : l'équivalent du panneau de trace Phoenix ── */
.card{top:12px;right:12px;bottom:12px;width:410px;display:flex;flex-direction:column;background:rgba(21,17,12,.96);border:1px solid var(--line);
  border-radius:4px;backdrop-filter:blur(8px);overflow:hidden}
.c-head{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.portrait{width:52px;height:52px}
.c-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.c-name h2{margin:0;font-size:19px;font-stretch:118%;font-weight:800;letter-spacing:-.01em}
.c-name span{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.c-state{display:flex;align-items:baseline;gap:6px;margin-top:4px;font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.c-state .mono{font-size:11.5px;color:var(--ink)}
.c-state i{flex:none;width:8px;height:8px;border-radius:2px;align-self:center}
.c-body{overflow-y:auto;flex:1;min-height:0}
.sec{padding:10px 14px 12px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600;display:flex;justify-content:space-between}
.sec h3 span{letter-spacing:0;text-transform:none;font-family:var(--mono);font-weight:400}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.st .k{font-size:11px;color:var(--ink2)}
.st .v{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.st .v small{font-size:10px;color:var(--ink3)}
.st .g{height:3px;background:var(--line);border-radius:1px;overflow:hidden;margin-top:3px}
.st .g i{display:block;height:100%;background:var(--accent)}
.st.hot .g i{background:var(--bad)} .st.hot .v{color:#ff7a66}

.wf{display:flex;flex-direction:column;gap:1px}
.wr{display:grid;grid-template-columns:62px 1fr 58px;gap:10px;align-items:start;width:100%;text-align:left;padding:4px 6px;border-radius:3px}
.wr:hover{background:rgba(255,255,255,.04)}
.wr.on{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.kind{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;padding:1px 4px;border-radius:2px;text-align:center;border:1px solid}
.k-llm{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.k-tool{color:var(--tool);border-color:color-mix(in srgb,var(--tool) 35%,transparent)}
.k-guard{color:#ff7a66;border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.k-wait,.k-stop{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 45%,transparent)}
.wl{min-width:0;display:flex;flex-direction:column;gap:3px}
.wl .lb{font-size:12.5px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.wl .lb code{display:block;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:1px}
.bar{position:relative;height:5px;background:rgba(255,255,255,.04);border-radius:1px}
.bar i{position:absolute;top:0;bottom:0;border-radius:1px;min-width:2px}
.wd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;padding-top:1px}
.kind{margin-top:1px}
.live{color:var(--accent-hi)}
.live::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent-hi);margin-left:4px;vertical-align:1px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

.attrs{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;margin:0}
.attrs dt{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
.attrs dd{margin:0;font-family:var(--mono);font-size:11.5px;min-width:0;overflow-wrap:anywhere}
.attrs dd.bad{color:#ff7a66} .attrs dd.good{color:var(--done)}
.gap{color:var(--alert);font-size:9px;margin-left:3px;cursor:help}
.io{margin:8px 0 0}
.io .lab{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px;display:flex;justify-content:space-between}
.io pre{margin:0;padding:7px 9px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:11.5px;
  line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:132px;overflow-y:auto;color:var(--ink)}
.evals{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding:7px 9px;border-radius:3px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.ev .n{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.ev .s{font-weight:700;font-size:12px}
.ev .s.ok{color:var(--done)} .ev .s.bad{color:var(--alert)}
.ev p{grid-column:1/-1;margin:0;font-size:11px;color:var(--ink2)}
.none{font-size:11px;color:var(--ink3)}
.legend{padding:8px 14px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line)}
.legend b{color:var(--alert);font-weight:400}

/* ── transport ── */
.transport{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:9px 16px 11px;background:var(--surface);border-top:1px solid var(--line)}
.ctrls{display:flex;gap:5px;align-items:center}
.ctrls button{border:1px solid var(--line);border-radius:3px;padding:5px 9px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);background:var(--surface2);min-width:32px}
.ctrls button:hover{border-color:var(--ink3);color:var(--ink)}
.ctrls button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1b1305;font-weight:600}
.ctrls #play{min-width:44px;color:var(--ink);font-size:13px}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.track{position:relative;height:26px}
.marks{position:absolute;left:0;right:0;top:3px;height:8px}
.marks i{position:absolute;top:0;width:2px;height:8px;border-radius:1px;transform:translateX(-1px)}
.track input{position:absolute;left:0;right:0;bottom:0;width:100%;margin:0;accent-color:var(--accent)}
.clock{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}

@media (max-width:980px){
  .card{width:360px}
  .feed{width:270px}
  .alert{width:calc(100% - 360px)}
}
@media (max-width:760px){
  .game{display:block;height:auto}
  .top{gap:10px}
  .res{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .main{overflow:visible;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
  .stage{position:relative;height:62vh;min-height:360px}
  .hud{position:static;transform:none;width:auto;margin:0 16px}
  .minimap,.cam{display:none}
  .alert{order:-1;margin-top:10px;min-width:0}
  .alert[hidden]{display:none!important}
  .card{max-height:none;backdrop-filter:none;background:var(--surface)}
  .c-body{overflow:visible}
  .feed{order:2}
  .transport{position:sticky;bottom:0;grid-template-columns:1fr;gap:6px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));z-index:5}
  .plate{min-width:96px;padding:4px 5px}
  .slot{width:19px;height:19px} .slot svg{width:11px;height:11px}
  .altar{min-width:0;max-width:120px} .altar .l{display:none}
  .bubble{max-width:150px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  .fe{animation:none} .live::after{animation:none} .slot.cast,.slot.castbad{animation:none}
}
</style>
</head>
<body>
<div class="game">
  <header class="top">
    <div class="brand"><b>Ruche</b><span>maquette HUD</span></div>
    <div class="task" id="task"><i>T-07</i>Ajouter `docId` au contrat RechercherDocuments et faire repasser l'eval retrieval</div>
    <div class="res" id="res"></div>
    <span class="pill run" id="status">en cours</span>
  </header>

  <div class="main">
    <div class="stage" id="stage"><div class="labels" id="labels"></div></div>

    <div class="hud minimap" aria-label="Mini-carte"><p class="hudlabel">Carte</p><canvas id="mini" width="288" height="288"></canvas></div>
    <div class="hud cam" role="group" aria-label="Caméra">
      <button id="camFree" aria-pressed="true">Libre</button>
      <button id="camFollow" aria-pressed="false">Suivre l'action</button>
      <button id="camReset">Recentrer</button>
    </div>
    <div class="hud alert" id="alert" hidden></div>
    <div class="hud feed" id="feed" aria-live="polite"></div>
    <aside class="hud card" id="card" aria-label="Fiche d'unité"></aside>
  </div>

  <footer class="transport">
    <div class="ctrls">
      <button id="prevInc" title="Incident précédent">◀◆</button>
      <button id="play" title="Lecture / pause (espace)">❚❚</button>
      <button id="nextInc" title="Incident suivant">◆▶</button>
      <span class="sep"></span>
      <button data-rate="1">×1</button><button data-rate="2">×2</button><button data-rate="4">×4</button><button data-rate="8">×8</button>
    </div>
    <div class="track"><div class="marks" id="marks"></div><input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Position dans le run"></div>
    <div class="clock" id="clock"></div>
  </footer>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

/* sol : alvéoles hexagonales, qui s'allument sous les agents actifs */
const HEX = 1.32, RINGS = 8;
const cells = [];
for (let q = -RINGS; q <= RINGS; q++) for (let r = -RINGS; r <= RINGS; r++) {
  if (Math.abs(q + r) > RINGS) continue;
  cells.push(new THREE.Vector3(HEX * Math.sqrt(3) * (q + r / 2), 0, HEX * 1.5 * r));
}
const floor = new THREE.InstancedMesh(
  new THREE.CylinderGeometry(HEX * 0.94, HEX * 0.94, 0.3, 6),
  new THREE.MeshStandardMaterial({ roughness: 0.82, metalness: 0.2 }),
  cells.length);
floor.receiveShadow = true;
const cellBase = [];
{
  const m = new THREE.Matrix4(), c = new THREE.Color();
  cells.forEach((p, i) => {
    const h = 0.15 * Math.sin(p.x * 0.7) * Math.cos(p.z * 0.6) * (p.length() > 10 ? 1 : 0.25);
    m.makeTranslation(p.x, -0.15 + h, p.z);
    floor.setMatrixAt(i, m);
    const v = 0.055 + ((i * 7919) % 13) / 13 * 0.02;
    c.setRGB(v * 1.25, v, v * 0.72);
    cellBase.push(c.clone());
    floor.setColorAt(i, c);
  });
}
scene.add(floor);

  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));

/* positions : la même ruche que layout.ts */
const POS = {};
{

/* ═════════ 2 bis · les autels : un par outil, sur les diagonales, entre les agents ═════════ */
const stone = () => new THREE.MeshStandardMaterial({ color: 0x3a3025, roughness: 0.7, metalness: 0.25, emissive: 0xe8a33c, emissiveIntensity: 0 });
function altarShape(tool) {
  const g = new THREE.Group(), m = stone();
  const add = (geo, x, y, z, ry = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.y = ry; o.castShadow = o.receiveShadow = true; g.add(o); return o; };
  if (tool === 'Read') {            // une pile de livres
    [[1.5, 0.28, 1.05, 0.2], [1.35, 0.3, 0.95, -0.25], [1.45, 0.26, 1.0, 0.5], [1.2, 0.28, 0.85, -0.1]]
      .reduce((y, [w, h, d, r]) => { add(new THREE.BoxGeometry(w, h, d), 0, y + h / 2, 0, r); return y + h; }, 0.45);
    return { g, m, top: 1.9 };
  }
  if (tool === 'Edit') {            // une enclume
    add(new THREE.BoxGeometry(0.8, 0.5, 0.7), 0, 0.7, 0);
    add(new THREE.BoxGeometry(0.5, 0.35, 0.45), 0, 1.12, 0);
    add(new THREE.BoxGeometry(1.8, 0.38, 0.8), 0.15, 1.48, 0);
    const horn = add(new THREE.ConeGeometry(0.3, 0.8, 4), -1.1, 1.48, 0); horn.rotation.z = Math.PI / 2;
    return { g, m, top: 1.7 };
  }
  if (tool === 'Write') {           // une stèle
    add(new THREE.BoxGeometry(1.4, 0.3, 0.7), 0, 0.6, 0);
    add(new THREE.BoxGeometry(1.1, 2.1, 0.22), 0, 1.8, 0);
    add(new THREE.CylinderGeometry(0.55, 0.55, 0.22, 24, 1, false, 0, Math.PI), 0, 2.85, 0).rotation.x = Math.PI / 2;
    return { g, m, top: 3.1 };
  }
  // Bash : un obélisque
  add(new THREE.CylinderGeometry(0.42, 0.62, 3.2, 4), 0, 2.05, 0, Math.PI / 4);
  add(new THREE.ConeGeometry(0.42, 0.6, 4), 0, 3.95, 0, Math.PI / 4);
  return { g, m, top: 4.3 };
}

const ALTAR = {};
TOOLS.forEach((tool, i) => {
  const ang = -Math.PI * 3 / 4 + i * Math.PI / 2, R = 12.2;
  const pos = new THREE.Vector3(Math.cos(ang) * R, 0, Math.sin(ang) * R);
  const root = new THREE.Group(); root.position.copy(pos); scene.add(root);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.95, 0.45, 8), new THREE.MeshStandardMaterial({ color: 0x241d15, roughness: 0.6, metalness: 0.5 }));
  base.position.y = 0.22; base.castShadow = base.receiveShadow = true; root.add(base);
  const rune = new THREE.Mesh(new THREE.RingGeometry(2.25, 2.4, 8), new THREE.MeshBasicMaterial({ color: hdr(0xe8a33c, 0.5), side: THREE.DoubleSide, transparent: true }));
  rune.rotation.x = -Math.PI / 2; rune.position.y = 0.03; root.add(rune);
  const shape = altarShape(tool);
  shape.g.rotation.y = Math.atan2(-pos.x, -pos.z);
  root.add(shape.g);
  const labEl = el('altar'); const lab = new CSS2DObject(labEl); lab.position.y = shape.top + 1.3; root.add(lab);
  ALTAR[tool] = { tool, pos, root, rune, mat: shape.m, top: shape.top, labEl, heat: 0, bad: 0, html: '', allowed: ALLOWED.has(tool) };
});
const altarTop = tool => ALTAR[tool].pos.clone().setY(ALTAR[tool].top);

function renderAltars(now) {
  for (const A of Object.values(ALTAR)) {
    const T = S.tools[A.tool];
    const html = `${GLYPH[A.tool]}<b>${A.tool}</b><span class="c">×${T.n}${T.deny ? `<em>✗${T.deny}</em>` : ''}</span>` +
      `<span class="l">${A.allowed ? (T.last ? esc(T.last) : 'pas encore appelé') : 'interdit par la politique'}</span>`;

}

/* ═════════ 3 · une unité par agent ═════════ */
function el(cls, html = '') { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; }

class Unit {
  constructor(d) {
    this.d = d; this.id = d.id;
    const human = d.depth < 0, root = d.depth === 0;
    this.g = new THREE.Group(); this.g.position.copy(POS[d.id]); scene.add(this.g);

    this.ped = new THREE.Mesh(
      new THREE.CylinderGeometry(root ? 1.9 : 1.55, root ? 2.15 : 1.8, 0.42, 6),
      new THREE.MeshStandardMaterial({ color: 0x2b231a, roughness: 0.45, metalness: 0.6 }));
    this.ped.position.y = 0.21; this.ped.castShadow = this.ped.receiveShadow = true;
    this.g.add(this.ped);

    this.inlay = new THREE.Mesh(new THREE.CylinderGeometry(root ? 1.5 : 1.2, root ? 1.5 : 1.2, 0.02, 6),
      new THREE.MeshBasicMaterial({ color: 0x000000 }));
    this.inlay.position.y = 0.43; this.g.add(this.inlay);

    this.pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 1, 12, 1, true),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    this.g.add(this.pillar);

    const coreGeo = human ? new THREE.IcosahedronGeometry(0.72, 0) : root ? new THREE.OctahedronGeometry(1.05, 0) : new THREE.OctahedronGeometry(0.8, 0);
    this.core = new THREE.Mesh(coreGeo, new THREE.MeshStandardMaterial({ color: 0x3a3025, roughness: 0.3, metalness: 0.35, flatShading: true }));
    this.core.castShadow = true;
    this.g.add(this.core);

    this.halo = new THREE.Mesh(new THREE.TorusGeometry(root ? 1.55 : 1.25, 0.03, 8, 72),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.g.add(this.halo);
    this.halo2 = this.halo.clone(); this.halo2.material = this.halo.material.clone(); this.g.add(this.halo2);

    const R = root ? 2.35 : 2.0;
    this.R = R;
    const ringBg = new THREE.Mesh(new THREE.RingGeometry(R, R + 0.14, 72), new THREE.MeshBasicMaterial({ color: 0x3a3025, side: THREE.DoubleSide }));
    ringBg.rotation.x = -Math.PI / 2; ringBg.position.y = 0.02; this.g.add(ringBg);
    this.ring = new THREE.Mesh(new THREE.RingGeometry(R, R + 0.14, 72, 1, Math.PI / 2, 0.001),
      new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    this.ring.rotation.x = -Math.PI / 2; this.ring.position.y = 0.03; this.g.add(this.ring);
    this.arc = 0;

    this.sel = new THREE.Group();
    for (let i = 0; i < 6; i++) {
      const m = new THREE.Mesh(new THREE.RingGeometry(R + 0.35, R + 0.45, 24, 1, i * Math.PI / 3 + 0.12, Math.PI / 3 - 0.24),
        new THREE.MeshBasicMaterial({ color: hdr(0xffd37a, 1.6), side: THREE.DoubleSide, transparent: true }));
      m.rotation.x = -Math.PI / 2; this.sel.add(m);
    }
    this.sel.position.y = 0.04; this.sel.visible = false; this.g.add(this.sel);

    this.beam = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.32, 14, 16, 1, true),
      new THREE.MeshBasicMaterial({ color: hdr(0x48d6e0, 2.2), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    this.g.add(this.beam);

    this.shock = new THREE.Mesh(new THREE.RingGeometry(1.8, 2.1, 64),
      new THREE.MeshBasicMaterial({ color: hdr(0xd9503f, 2.5), transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.shock.rotation.x = -Math.PI / 2; this.shock.position.y = 0.5; this.g.add(this.shock);

    /* étincelles quand un outil tourne */
    this.N = 36;
    this.sp = new Float32Array(this.N * 3); this.sv = new Float32Array(this.N * 3); this.sl = new Float32Array(this.N);
    const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(this.sp, 3));
    this.sparks = new THREE.Points(sg, new THREE.PointsMaterial({ color: hdr(0xffd9a0, 2.4), size: 0.09, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    this.g.add(this.sparks);

    this.plateEl = el('plate', human
      ? `<div class="pl-top"><b>${esc(d.id)}</b><span class="pl-st"><i style="background:var(--accent-hi)"></i>humain</span></div>`
      : `<div class="pl-top"><b>${esc(d.id)}</b><span class="pl-st"><i></i><span></span></span></div>
         <div class="pl-g" title="Quota d'appels"><i></i></div>
         <div class="pl-num"></div>
         <div class="skills">${TOOLS.map(t => `<span class="slot${ALLOWED.has(t) ? '' : ' off'}" data-t="${t}" title="${t}">${GLYPH[t]}<span class="x"></span><span class="n"></span></span>`).join('')}</div>
         <div class="pl-hand"></div>`);
    this.plate = new CSS2DObject(this.plateEl); this.g.add(this.plate);
    const q = s => this.plateEl.querySelector(s);
    this.pe = human ? null : {
      dot: q('.pl-st i'), st: q('.pl-st > span'), gauge: q('.pl-g i'), num: q('.pl-num'), hand: q('.pl-hand'),
      slots: Object.fromEntries([...this.plateEl.querySelectorAll('.slot')].map(s => [s.dataset.t, { el: s, n: s.querySelector('.n'), x: s.querySelector('.x'), k: '' }])),
    };
    this.bubEl = el('bubble'); this.bub = new CSS2DObject(this.bubEl); this.g.add(this.bub);
    this.plateHtml = ''; this.bubHtml = null;
    this.tmp = new THREE.Color(); this.col = new THREE.Color(COL.absent); this.y = 1.6;
  }

  update(a, dt, now, tNow, selected, real) {
    const alive = a.st !== 'absent';
    this.g.visible = alive;
    if (!alive) { this.plateEl.style.display = this.bubEl.style.display = 'none'; return; }
    this.plateEl.style.display = '';
    const lit = a.st === 'think' || a.st === 'tool' || a.st === 'deny' || a.st === 'human';
    const k = Math.min(1, dt * 6);
    this.col.lerp(this.tmp.setHex(COL[a.st]), k);

    const m = this.core.material;
    m.color.copy(this.col).multiplyScalar(0.55);
    m.emissive.copy(this.col);
    m.emissiveIntensity += ((lit ? 2.3 : a.st === 'done' ? 0.55 : 0.28) - m.emissiveIntensity) * k;

    /* hauteur → coût (appels), comme dans ruche */
    const wantY = 1.55 + Math.min(a.calls, 9) * 0.26 + (a.depth < 0 ? 0.2 : 0);
    this.y += (wantY - this.y) * k;
    const bob = a.st === 'done' ? 0 : Math.sin(now / 700 + this.g.position.x) * 0.12;
    const cy = this.y + bob;
    this.core.position.y = cy;
    const spin = a.st === 'think' ? 2.6 : a.st === 'tool' ? 1.4 : a.st === 'done' ? 0.1 : 0.45;
    this.core.rotation.y += dt * spin;
    const pulse = a.st === 'think' ? 1 + Math.sin(now / 140) * 0.06 : a.st === 'deny' ? 1 + Math.sin(now / 45) * 0.05 : 1;
    this.core.scale.setScalar(pulse);

    this.pillar.scale.y = Math.max(0.01, cy - 0.45); this.pillar.position.y = 0.43 + this.pillar.scale.y / 2;
    this.pillar.material.color.copy(this.col).multiplyScalar(lit ? 1.4 : 0.35);
    this.inlay.material.color.copy(this.col).multiplyScalar(lit ? 1.6 : 0.25);

    /* double anneau qui tourne pendant la réflexion */
    const hOn = a.st === 'think' ? 0.9 : 0;
    for (const [h, s] of [[this.halo, 1], [this.halo2, -1.3]]) {
      h.material.opacity += (hOn - h.material.opacity) * k;
      h.material.color.copy(hdr(COL.think, 2.2));
      h.position.y = cy;
      h.rotation.x = Math.PI / 2 + Math.sin(now / 900 * s) * 0.6;
      h.rotation.y += dt * 1.8 * s;
    }

    /* anneau de quota */
    const q = Math.min(1, a.calls / MAXC), want = Math.max(0.001, q * Math.PI * 2);
    if (Math.abs(this.arc - want) > 0.01) {
      this.arc = want; this.ring.geometry.dispose();
      this.ring.geometry = new THREE.RingGeometry(this.R, this.R + 0.14, 72, 1, Math.PI / 2, want);
    }
    this.ring.material.color.copy(q > 0.8 ? hdr(0xd9503f, 1.8) : hdr(0xe8a33c, 1.3));

    this.sel.visible = selected;
    if (selected) { this.sel.rotation.y += dt * 0.6; }

    /* faisceau : main levée */
    const wb = a.hand ? 0.5 + Math.sin(now / 220) * 0.2 : 0;
    this.beam.material.opacity += (wb - this.beam.material.opacity) * k;
    this.beam.position.y = cy + 7;

    /* onde de choc : un hook vient de refuser */
    const age = a.lastDeny === null ? null : tNow - a.lastDeny;
    if (age !== null && age >= 0 && age < 1500) {
      const f = age / 1500;
      this.shock.material.opacity = (1 - f) * 0.95; this.shock.scale.setScalar(1 + f * 2.6);
    } else this.shock.material.opacity = 0;

    /* étincelles */
    const emit = a.st === 'tool' && real > 0;
    for (let i = 0; i < this.N; i++) {
      this.sl[i] -= dt;
      if (this.sl[i] <= 0) {
        if (!emit || Math.random() > 0.35) { this.sp[i * 3 + 1] = -99; continue; }
        const g = Math.random() * Math.PI * 2, r = 0.35 + Math.random() * 0.4;
        this.sp[i * 3] = Math.cos(g) * r; this.sp[i * 3 + 1] = cy; this.sp[i * 3 + 2] = Math.sin(g) * r;
        this.sv[i * 3] = Math.cos(g) * (1 + Math.random() * 2); this.sv[i * 3 + 1] = 2 + Math.random() * 3; this.sv[i * 3 + 2] = Math.sin(g) * (1 + Math.random() * 2);
        this.sl[i] = 0.5 + Math.random() * 0.5;
      }
      this.sv[i * 3 + 1] -= 7 * dt;
      for (let j = 0; j < 3; j++) this.sp[i * 3 + j] += this.sv[i * 3 + j] * dt;
    }
    this.sparks.geometry.attributes.position.needsUpdate = true;

    /* plaque au-dessus de la tête */
    this.plate.position.y = cy + 1.75;
    const cls = 'plate' + (selected ? ' sel' : '') + (a.st === 'done' ? ' off' : '');
    if (this.plateEl.className !== cls) this.plateEl.className = cls;
    const P = this.pe;
    if (P) {
      const st = a.st === 'tool' && a.open ? a.open.tool : LABEL[a.st];
      const key = `${a.st}|${st}|${a.calls}|${a.tin + a.tout}|${!!a.hand}`;
      if (key !== this.plateHtml) {
        this.plateHtml = key;
        P.dot.style.background = hex(COL[a.st]); P.st.textContent = st;
        P.gauge.style.width = q * 100 + '%'; P.gauge.style.background = q > 0.8 ? 'var(--bad)' : 'var(--accent)';
        P.num.textContent = `${a.calls}/${MAXC} appels · ${kTok(a.tin + a.tout)} tok · ${eur(a.eur)}`;
        P.hand.textContent = a.hand ? '▲ MAIN LEVÉE' : '';
      }
      for (const t of TOOLS) {
        const T = a.tools[t], s = P.slots[t];
        const active = a.open?.kind === 'tool' && a.open.tool === t;
        const k = `${T.n}|${T.deny}|${active}`;
        if (k === s.k) continue;
        s.k = k;
        s.n.textContent = T.n ? T.n : '';
        s.x.textContent = T.deny ? '✗' + T.deny : '';
        s.el.classList.toggle('used', T.n > 0);
        s.el.classList.toggle('denied', T.deny > 0);
        s.el.classList.toggle('active', active);
      }
    }

    /* bulle : ce que l'agent pense, ou la commande qu'il lance */
    let bub = null, bcls = 'bubble';
    if (a.open?.kind === 'llm') bub = a.open.label;
    else if (a.open?.kind === 'tool') { bub = a.open.args; bcls += ' tool'; }
    this.bub.position.y = cy + 3.1;
    if (bub !== this.bubHtml) {
      this.bubHtml = bub;
      this.bubEl.style.display = bub ? '' : 'none';
      if (bub) { this.bubEl.textContent = bub; this.bubEl.className = bcls; }
    }
  }

  /** L'emplacement de l'outil flashe au lancement : ambre, ou rouge si l'appel sera refusé. */
  cast(tool, bad) {
    const s = this.pe?.slots[tool]; if (!s) return;
    s.el.classList.remove('cast', 'castbad'); void s.el.offsetWidth;
    s.el.classList.add(bad ? 'castbad' : 'cast');
  }
}

const units = new Map(AGENTS.map(d => [d.id, new Unit(d)]));
const unitAt = id => units.get(id);

/* filiation : tubes discrets orchestrateur → sous-agents */
const edges = [];
for (const d of AGENTS) if (d.depth === 1) {
  const a = POS['orchestrateur'].clone().setY(0.5), b = POS[d.id].clone().setY(0.5);
  const mid = a.clone().add(b).multiplyScalar(0.5); mid.y += 1.2;
  const t = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a, mid, b), 30, 0.04, 6),
    new THREE.MeshBasicMaterial({ color: 0x6d5c45, transparent: true, opacity: 0.6 }));
  scene.add(t); edges.push({ id: d.id, t });
}

/* messages : une comète qui suit un arc */
const comets = Array.from({ length: 8 }, () => {
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 14, 10), new THREE.MeshBasicMaterial());
  const pts = new Float32Array(20 * 3);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  const trail = new THREE.Line(g, new THREE.LineBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  head.visible = trail.visible = false; scene.add(head, trail);
  return { head, trail, pts };
});
const curveOf = (from, to) => {
  const a = POS[from].clone(); a.y = unitAt(from).y;
  const b = POS[to].clone(); b.y = unitAt(to).y;
  const mid = a.clone().add(b).multiplyScalar(0.5); mid.y += 4.2;
  return new THREE.QuadraticBezierCurve3(a, mid, b);
};

/* ═════════ 3 bis · les sorts : météores, boucliers, braises ═════════
   Le temps des effets est le temps RÉEL de l'écran, pas celui du run : un Read de 120 ms
   donne quand même un météore d'une seconde. La timeline reste exacte, seul l'effet s'étire. */
const EMB = 900;
const eP = new Float32Array(EMB * 3), eV = new Float32Array(EMB * 3), eC = new Float32Array(EMB * 3), eB = new Float32Array(EMB * 3);
const eL = new Float32Array(EMB), eL0 = new Float32Array(EMB).fill(1);
for (let i = 0; i < EMB; i++) eP[i * 3 + 1] = -99;
const eGeo = new THREE.BufferGeometry();
eGeo.setAttribute('position', new THREE.BufferAttribute(eP, 3));
eGeo.setAttribute('color', new THREE.BufferAttribute(eC, 3));
scene.add(new THREE.Points(eGeo, new THREE.PointsMaterial({ size: 0.16, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
let eNext = 0;
function ember(p, vx, vy, vz, col, life) {
  const i = eNext++ % EMB;
  eP.set([p.x, p.y, p.z], i * 3); eV.set([vx, vy, vz], i * 3); eB.set([col.r, col.g, col.b], i * 3);
  eL[i] = eL0[i] = life;
}
function burst(p, col, n, speed, up = 1) {
  for (let i = 0; i < n; i++) {
    const g = Math.random() * Math.PI * 2, s = speed * (0.4 + Math.random() * 0.8);
    ember(p, Math.cos(g) * s, (1 + Math.random() * 2.5) * up, Math.sin(g) * s, col, 0.5 + Math.random() * 0.7);
  }
}
const C_GOLD = hdr(0xffc46b, 2.6), C_HOT = hdr(0xfff0c8, 3.2), C_RED = hdr(0xff5a40, 3), C_EMBER = hdr(0xe8903c, 2.2);

const rings = Array.from({ length: 10 }, () => {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.72, 48), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; scene.add(m); return { m, age: 9 };
});
function ring(p, col) {
  const r = rings.reduce((a, b) => (b.age > a.age ? b : a));
  r.age = 0; r.m.position.set(p.x, 0.12, p.z); r.m.material.color.copy(col);
}

const shields = Array.from({ length: 4 }, () => {
  const m = new THREE.Mesh(new THREE.CircleGeometry(1.25, 6), new THREE.MeshBasicMaterial({ color: hdr(0xd9503f, 2.2), transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.CircleGeometry(1.25, 6)), new THREE.LineBasicMaterial({ color: hdr(0xff7a66, 3), transparent: true, opacity: 0 }));
  m.add(edge); scene.add(m); return { m, edge, age: 9 };
});
function shield(p, face) {
  const s = shields.reduce((a, b) => (b.age > a.age ? b : a));
  s.age = 0; s.m.position.copy(p); s.m.lookAt(face);
}

const launched = new Set(), arrived = new Set();
const meteors = [];
function launch(call) {
  const u = unitAt(call.actor);
  const a = POS[call.actor].clone(); a.y = u.y;
  const b = altarTop(call.tool);
  const mid = a.clone().lerp(b, 0.62); mid.y += 10;
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 1), new THREE.MeshBasicMaterial({ color: C_HOT }));
  const pts = new Float32Array(24 * 3), g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  const trail = new THREE.Line(g, new THREE.LineBasicMaterial({ color: C_GOLD, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(head, trail);
  meteors.push({ call, curve: new THREE.QuadraticBezierCurve3(a, mid, b), k: 0, stop: call.blocked ? 0.8 : 1, head, trail, pts });
  launched.add(call.seq);
  u.cast(call.tool, !!call.blocked);
  burst(a, C_EMBER, 14, 1.5);
}
function kill(m) { scene.remove(m.head, m.trail); m.head.geometry.dispose(); m.trail.geometry.dispose(); }

/** L'appel est fini (dans le temps du run) et le météore est arrivé : on montre l'issue sur l'autel. */
function impact(call) {
  const A = ALTAR[call.tool], p = altarTop(call.tool);
  if (call.ok) {
    burst(p, C_GOLD, 46, 3.2); burst(p, C_HOT, 12, 1.2, 2); ring(A.pos, C_GOLD); A.heat = 1;
    floatWorld(p, `${call.tool} ✓ ${dur(call.ms)}`, 'f-ok');
  } else {
    burst(p, C_RED, 46, 3.2); ring(A.pos, C_RED); A.bad = 1;
    floatWorld(p, `${call.tool} ✗ ${call.out}`, 'f-bad');
  }
}
function arrive(m) {
  const { call } = m;
  arrived.add(call.seq);
  if (call.blocked) {
    const p = m.head.position.clone();
    shield(p, POS[call.actor].clone().setY(p.y));
    burst(p, C_RED, 60, 4, 0.6);
    ALTAR[call.tool].bad = 0.6;
    floatWorld(p, `✗ ${call.tool} refusé · ${call.blocked}`, 'f-bad');
    if (!reduce) shake = 0.35;
  } else if (call.t1 !== null && call.t1 <= tNow) impact(call);
  else { burst(altarTop(call.tool), C_GOLD, 16, 1.6); ALTAR[call.tool].heat = 0.6; }
}

/* le lien canalisé : tant que l'outil tourne, un flot de braises va de l'agent à l'autel */
const tethers = new Map();
for (const d of AGENTS) {
  if (d.depth < 0) continue;
  const n = 22, pts = new Float32Array(n * 3), g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  const beads = new THREE.Points(g, new THREE.PointsMaterial({ color: C_GOLD, size: 0.2, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  const lg = new THREE.BufferGeometry(); const lp = new Float32Array(30 * 3); lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
  const line = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: hdr(0xe8a33c, 0.9), transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
  beads.visible = line.visible = false;
  scene.add(beads, line);
  tethers.set(d.id, { beads, pts, line, lp, n });
}

function updateSpells(dt, now) {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.k = Math.min(m.stop, m.k + dt / 1.0);
    const k = m.k, p = m.curve.getPoint(k);
    m.head.position.copy(p);
    m.head.rotation.x += dt * 9; m.head.rotation.y += dt * 7;
    for (let j = 0; j < 24; j++) { const q = m.curve.getPoint(Math.max(0, k - 0.24 + 0.24 * j / 23)); m.pts.set([q.x, q.y, q.z], j * 3); }
    m.trail.geometry.attributes.position.needsUpdate = true;
    for (let j = 0; j < 3; j++) ember(p, (Math.random() - .5) * 1.2, (Math.random() - .3) * 1.2, (Math.random() - .5) * 1.2, j ? C_EMBER : C_GOLD, 0.35 + Math.random() * 0.4);
    if (k >= m.stop) { arrive(m); kill(m); meteors.splice(i, 1); }
  }

  for (let i = 0; i < EMB; i++) {
    if (eL[i] <= 0) continue;
    eL[i] -= dt;
    if (eL[i] <= 0) { eP[i * 3 + 1] = -99; eC.fill(0, i * 3, i * 3 + 3); continue; }
    const f = eL[i] / eL0[i];
    eV[i * 3 + 1] -= 5 * dt;
    for (let j = 0; j < 3; j++) { eV[i * 3 + j] *= 0.985; eP[i * 3 + j] += eV[i * 3 + j] * dt; eC[i * 3 + j] = eB[i * 3 + j] * f; }
    if (eP[i * 3 + 1] < 0.05) { eP[i * 3 + 1] = 0.05; eV[i * 3 + 1] *= -0.3; }
  }
  eGeo.attributes.position.needsUpdate = true; eGeo.attributes.color.needsUpdate = true;

  for (const r of rings) {
    r.age += dt;
    const f = Math.min(1, r.age / 0.9);
    r.m.scale.setScalar(1 + f * 7); r.m.material.opacity = r.age < 0.9 ? (1 - f) * 0.9 : 0;
  }
  for (const s of shields) {
    s.age += dt;
    const f = Math.min(1, s.age / 0.9);
    s.m.scale.setScalar(0.6 + Math.min(1, s.age * 8) * 0.5 + f * 0.25);
    s.m.material.opacity = s.age < 0.9 ? (1 - f) * 0.55 : 0; s.edge.material.opacity = s.age < 0.9 ? 1 - f : 0;
  }

  const chan = {};
  for (const [id, T] of tethers) {
    const a = S.agents[id], sp = a.open;
    const on = sp?.kind === 'tool' && (arrived.has(sp.seq) || !launched.has(sp.seq));
    T.beads.visible = T.line.visible = on;
    if (!on) continue;
    chan[sp.tool] = true;
    const s = POS[id].clone(); s.y = unitAt(id).y;
    const e = altarTop(sp.tool), mid = s.clone().lerp(e, 0.5); mid.y += 3.5;
    const c = new THREE.QuadraticBezierCurve3(s, mid, e);
    for (let j = 0; j < 30; j++) { const q = c.getPoint(j / 29); T.lp.set([q.x, q.y, q.z], j * 3); }
    for (let j = 0; j < T.n; j++) { const q = c.getPoint((j / T.n + now * 0.00055) % 1); T.pts.set([q.x, q.y, q.z], j * 3); }
    T.line.geometry.attributes.position.needsUpdate = true; T.beads.geometry.attributes.position.needsUpdate = true;
  }

  for (const A of Object.values(ALTAR)) {
    A.heat = Math.max(chan[A.tool] ? 0.35 + Math.sin(now / 160) * 0.15 : 0, A.heat - dt * 1.1);
    A.bad = Math.max(0, A.bad - dt * 1.1);
    const red = A.bad > A.heat;
    A.mat.emissive.setHex(red ? 0xd9503f : 0xe8a33c);
    A.mat.emissiveIntensity = Math.max(A.heat, A.bad) * 2.6;
    A.rune.material.color.copy(red ? hdr(0xd9503f, 0.5 + A.bad * 2.5) : hdr(0xe8a33c, 0.5 + A.heat * 2.5));
  }
}

let tNow = 16900, rate = 2, playing = true, selected = 'codeur', spanSel = null, follow = false;
let S = stateAt(tNow);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let shake = 0;

const floats = [];
function floatAt(id, text, cls) {
  const u = unitAt(id); if (!u) return;
  const d = el('float ' + cls); d.textContent = text;
  const o = new CSS2DObject(d);
  o.position.set((Math.random() - .5) * 1.2, u.y + 1.2, 0);
  u.g.add(o);
  floats.push({ o, d, born: performance.now() });
}
function floatWorld(p, text, cls) {
  const d = el('float ' + cls); d.textContent = text;
  const o = new CSS2DObject(d); o.position.copy(p).y += 0.9;
  scene.add(o);
  floats.push({ o, d, born: performance.now() });
}
function onEvent(e) {
  switch (e.kind) {
    case 'think.end': floatAt(e.actor, `+${kTok((e.cost?.tok_in || 0) + (e.cost?.tok_out || 0))} tok  ${eur(e.cost?.eur || 0)}`, 'f-tok'); break;
    case 'tool.start': { const c = callOf(e.seq); if (c && ALTAR[c.tool]) launch(c); break; }
    case 'tool.end': { const c = CALLS.find(c => c.actor === e.actor && c.t1 === e.t && !c.blocked); if (c && arrived.has(c.seq)) impact(c); break; }
    case 'hook.deny': if (!e.tool) { floatAt(e.actor, `✗ arrêt refusé · ${e.hook}`, 'f-bad'); if (!reduce) shake = 0.35; } break;
    case 'hook.allow': floatAt(e.actor, `✓ ${e.reason}`, 'f-good'); break;
    case 'agent.end': floatAt(e.actor, 'TERMINÉ', 'f-good'); break;
    case 'flag': floatAt(e.actor, '▲ MAIN LEVÉE', 'f-alert'); break;
    case 'human': floatAt(e.to, `✦ ${e.actor} intervient`, 'f-human'); break;
  }
}

      <div class="sec"><h3>Évaluations</h3><div class="evals">${evals.join('') || '<p class="none">Aucun drapeau ni verdict sur cet agent.</p>'}</div></div>`}
    </div>
    <div class="legend"><b>◇</b> champ que Phoenix affiche mais que le contrat ruche ne porte pas encore</div>`;
  card.querySelector('.c-body').scrollTop = scroll;
  for (const b of card.querySelectorAll('.wr')) b.onclick = () => { spanSel = +b.dataset.seq; renderCard(true); };
}

/* mini-carte */
const mini = $('mini').getContext('2d');
function renderMini(now) {
  const W = 288, s = W / 34, c = W / 2;
  const P = v => [c + v.x * s, c + (v.z - 1.8) * s];
  mini.clearRect(0, 0, W, W);
  mini.strokeStyle = '#2a2219'; mini.lineWidth = 2;
  mini.beginPath(); mini.arc(c, c - 1.8 * s, 15.5 * s, 0, Math.PI * 2); mini.stroke();
  mini.strokeStyle = '#4a3d2e';
  for (const { id } of edges) if (S.agents[id].st !== 'absent') {
    const [x0, y0] = P(POS.orchestrateur), [x1, y1] = P(POS[id]);
    mini.beginPath(); mini.moveTo(x0, y0); mini.lineTo(x1, y1); mini.stroke();
  }
  /* champ de vision */
  const dir = controls.target.clone().sub(camera.position).setY(0).normalize();
  const [cx, cy] = P(camera.position.clone().setY(0).clampLength(0, 16));
  const g = Math.atan2(dir.z, dir.x);
  mini.fillStyle = 'rgba(255,211,122,.08)';
  mini.beginPath(); mini.moveTo(cx, cy); mini.arc(cx, cy, 170, g - 0.42, g + 0.42); mini.closePath(); mini.fill();
  mini.font = '600 15px "IBM Plex Mono", monospace'; mini.textAlign = 'center'; mini.textBaseline = 'middle';
  for (const A of Object.values(ALTAR)) {
    const [x, y] = P(A.pos), h = Math.max(A.heat, A.bad);
    mini.fillStyle = A.bad > A.heat ? `rgba(217,80,63,${0.25 + h * 0.6})` : `rgba(232,163,60,${0.12 + h * 0.6})`;
    mini.strokeStyle = '#6d5c45'; mini.lineWidth = 1.5;
    mini.fillRect(x - 11, y - 11, 22, 22); mini.strokeRect(x - 11, y - 11, 22, 22);
    mini.fillStyle = '#f0e0c4'; mini.fillText(A.tool[0], x, y + 1);
  }
  for (const m of meteors) {
    const [x, y] = P(m.head.position);
    mini.fillStyle = '#ffd37a'; mini.beginPath(); mini.arc(x, y, 3.5, 0, Math.PI * 2); mini.fill();
  }
  for (const a of Object.values(S.agents)) {
    if (a.st === 'absent') continue;
    const [x, y] = P(POS[a.id]);
    if (a.hand) { mini.strokeStyle = '#48d6e0'; mini.lineWidth = 2; mini.beginPath(); mini.arc(x, y, 14 + Math.sin(now / 200) * 3, 0, Math.PI * 2); mini.stroke(); }
    if (a.id === selected) { mini.strokeStyle = '#ffd37a'; mini.lineWidth = 2; mini.beginPath(); mini.arc(x, y, 10, 0, Math.PI * 2); mini.stroke(); }
    mini.fillStyle = hex(COL[a.st]);
    mini.beginPath(); mini.arc(x, y, a.depth === 0 ? 7 : 5.5, 0, Math.PI * 2); mini.fill();
  }
}

/* transport */
const scrub = $('scrub');
const INC = EVENTS.filter(e => e.kind === 'hook.deny' || e.kind === 'flag' || e.kind === 'human').map(e => e.t);
$('marks').innerHTML = EVENTS.filter(e => ['hook.deny', 'flag', 'human', 'agent.end'].includes(e.kind)).map(e => {
  const c = { 'hook.deny': 'var(--bad)', flag: 'var(--alert)', human: 'var(--accent-hi)', 'agent.end': 'var(--done)' }[e.kind];
  return `<i style="left:${e.t / DUR * 100}%;background:${c}" title="${esc(e.actor)} · ${esc(e.kind)} · ${clockOf(e.t)}"></i>`;
}).join('');
function seek(t) {
  tNow = Math.max(0, Math.min(DUR, t)); S = stateAt(tNow);
  for (const m of meteors) kill(m);
  meteors.length = 0; launched.clear(); arrived.clear();
}
function setPlay(p) { playing = p; $('play').textContent = p ? '❚❚' : '▶'; }
function setRate(r) { rate = r; for (const b of document.querySelectorAll('[data-rate]')) b.setAttribute('aria-pressed', String(+b.dataset.rate === r)); }
function setFollow(f) { follow = f; $('camFollow').setAttribute('aria-pressed', String(f)); $('camFree').setAttribute('aria-pressed', String(!f)); }
function select(id) { selected = id; spanSel = null; renderCard(true); }
$('play').onclick = () => { if (tNow >= DUR) seek(0); setPlay(!playing); };
for (const b of document.querySelectorAll('[data-rate]')) b.onclick = () => setRate(+b.dataset.rate);
scrub.oninput = () => { seek(scrub.value / 1000 * DUR); setPlay(false); };
$('nextInc').onclick = () => { const t = INC.find(x => x > tNow + 5); if (t !== undefined) { seek(t - 1200); setPlay(true); } };
$('prevInc').onclick = () => { const t = [...INC].reverse().find(x => x < tNow - 1300); seek(t !== undefined ? t - 1200 : 0); setPlay(true); };
$('camFree').onclick = () => setFollow(false);
$('camFollow').onclick = () => setFollow(true);
$('camReset').onclick = () => { setFollow(false); camera.position.copy(HOME.pos); controls.target.copy(HOME.tgt); };
addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').click(); } });
setRate(2);

/* clic sur une unité */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const targets = [...units.values()].filter(u => u.g.visible).flatMap(u => [u.core, u.ped]);
  const hit = ray.intersectObjects(targets, false)[0];
  if (hit) for (const u of units.values()) if (u.core === hit.object || u.ped === hit.object) select(u.id);
});

function resize() {
  const r = stageEl.getBoundingClientRect();
  if (!r.width || !r.height) return;
  renderer.setSize(r.width, r.height, false);
  composer.setSize(r.width, r.height);
  labels.setSize(r.width, r.height);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stageEl);
resize();

/* ═════════ 6 · la boucle ═════════ */
let prev = performance.now(), hudT = 0;
const camOff = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  let real = 0;
  if (playing) {
    const before = tNow;
    tNow = Math.min(DUR, tNow + dt * 1000 * rate); real = tNow - before;
    for (const e of EVENTS) if (e.t > before && e.t <= tNow) onEvent(e);
    S = stateAt(tNow);
    if (tNow >= DUR) setPlay(false);
  }
  for (const u of units.values()) u.update(S.agents[u.id], dt, now, tNow, u.id === selected, playing ? 1 : 0);
  for (const { id, t } of edges) t.visible = S.agents[id].st !== 'absent';
  updateSpells(dt, now);

  /* comètes */
  let i = 0;
  for (const m of S.msgs) {
    const age = tNow - m.t;
    if (age < 0 || age > 1800 || i >= comets.length) continue;
    const k = Math.min(1, age / 1500), c = comets[i++], cv = curveOf(m.from, m.to);
    const col = m.human ? hdr(0xffd37a, 3) : hdr(0xe8a33c, 2.6);
    c.head.visible = c.trail.visible = true;
    c.head.material.color.copy(col); c.head.scale.setScalar(m.human ? 1.5 : 1);
    c.head.position.copy(cv.getPoint(k));
    for (let j = 0; j < 20; j++) { const p = cv.getPoint(Math.max(0, k - 0.35 + 0.35 * j / 19)); c.pts.set([p.x, p.y, p.z], j * 3); }
    c.trail.geometry.attributes.position.needsUpdate = true;
    c.trail.material.color.copy(col); c.trail.material.opacity = 1 - Math.max(0, age - 1500) / 300;
  }
  for (; i < comets.length; i++) comets[i].head.visible = comets[i].trail.visible = false;

  /* sol : les alvéoles s'allument près des agents actifs */
  const cc = new THREE.Color();
  cells.forEach((p, j) => {
    cc.copy(cellBase[j]);
    for (const u of units.values()) {
      const a = S.agents[u.id];
      if (a.st === 'absent') continue;
      const d = p.distanceTo(POS[u.id]);
      if (d < 4.2) cc.lerp(u.col, (1 - d / 4.2) * (a.st === 'think' || a.st === 'tool' || a.st === 'deny' ? 0.3 : 0.1));
    }
    floor.setColorAt(j, cc);
  });
  floor.instanceColor.needsUpdate = true;

  dust.rotation.y += dt * 0.01;

  /* nombres flottants */
  for (let j = floats.length - 1; j >= 0; j--) {
    const f = floats[j], age = (now - f.born) / 1000;
    if (age > 1.9) { f.o.parent?.remove(f.o); f.d.remove(); floats.splice(j, 1); continue; }
    f.o.position.y += dt * 1.1;
    f.d.style.opacity = String(age < 1.2 ? 1 : 1 - (age - 1.2) / 0.7);
  }

  /* caméra réalisatrice */
  if (follow && S.last) {
    const want = POS[S.last].clone().setY(1.5);
    camOff.copy(camera.position).sub(controls.target);
    controls.target.lerp(want, Math.min(1, dt * 1.6));
    camera.position.copy(controls.target).add(camOff);
  }
  controls.update();
  const jitter = shake > 0 ? shake * 0.25 : 0;
  if (jitter) { camera.position.x += (Math.random() - .5) * jitter; camera.position.y += (Math.random() - .5) * jitter; shake = Math.max(0, shake - dt); }

  composer.render();
  labels.render(scene, camera);

  hudT += dt;
  if (hudT > 0.08) {
    hudT = 0;
    renderRes(); renderFeed(); renderAlert(); renderCard(false); renderMini(now); renderAltars(now);
    if (document.activeElement !== scrub) scrub.value = String(Math.round(tNow / DUR * 1000));
    $('clock').textContent = `${clockOf(tNow)} / ${clockOf(DUR)} · seq ${S.count - 1}`;
  }
  requestAnimationFrame(frame);
}
renderCard(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
